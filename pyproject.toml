[project]
name = "orchestra"
version = "1.0.0"
description = "A Google ADK orchestrator agent that commands builder agents across five frameworks"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # the orchestrator, its QA sub-agent and its art director
    "google-adk[mcp]>=2.2.0",
    # the builder workers, one per framework
    "strands-agents[openai]>=1.43.0",
    "pydantic-ai-slim[mcp,openai]>=1.107.0",
    "agent-framework-core>=1.8.1",
    "agent-framework-openai>=1.8.1",
    "agno[mcp]>=2.6.14",
    # shared
    "mcp>=1.2.0",
    "openai>=2.34.0",
    "python-dotenv>=1.2.2",
    "rich>=15.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.6.0",
]

[project.scripts]
orchestra = "orchestra.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/orchestra"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 110
src = ["src", "tests"]

[tool.ruff.lint]
# Defaults plus import sorting. Deliberately not the "select everything" set:
# this codebase catches broad exceptions and uses naive local timestamps on
# purpose, and a linter that flags those trains you to ignore it.
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.isort]
known-first-party = ["orchestra"]
